<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101824"><title>JRadio Lite</title><style>*{box-sizing:border-box}body{margin:0;background:#101824;color:#f6f9fd;font:18px Arial,sans-serif}header{padding:24px 24px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:32px;margin:0}header span{font-size:14px;color:#94a7bb}.status{padding:0 24px 20px;color:#aebdd0;min-height:40px}.grid{padding:0 18px 140px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.station{min-height:98px;background:#233349;border:2px solid #34485f;border-radius:17px;color:white;font-size:20px;font-weight:700;padding:12px;cursor:pointer}.station.active{background:#15483f;border-color:#55e1c1}.station.missing{color:#b3c3d1}.bar{position:fixed;bottom:0;left:0;right:0;background:#182639;border-top:1px solid #405168;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.bar small{font-size:13px;color:#9db1c7}.bar strong{font-size:21px}.bar button,.modal button{border:0;border-radius:12px;background:#55d9bd;color:#08251f;padding:14px 22px;font-size:19px;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.83);padding:20px}.panel{background:#233349;border-radius:16px;padding:24px;max-width:680px;margin:10vh auto}.panel input{width:100%;padding:15px;font-size:18px;border:0;border-radius:9px;margin:12px 0 20px}.panel p{color:#d1d9e2;font-size:16px;line-height:1.5}.panel button+button{background:#71839b;color:white;margin-left:8px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.station{font-size:17px;min-height:82px}h1{font-size:26px}.bar strong{font-size:16px}}@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><h1>📻 JRadio Lite</h1><span>Family Hub · v0.3</span></header><div id="status" class="status">Dodirni postaju za slušanje. Dugi pritisak za promjenu streama.</div><main id="grid" class="grid"></main><footer class="bar"><div><small>TRENUTAČNO</small><div><strong id="current">Ništa ne svira</strong></div></div><button id="toggle">▶ Pokreni</button></footer><div id="modal" class="modal"><div class="panel"><h2 id="editTitle">Stream</h2><p>Unesi izravnu HTTPS adresu MP3/AAC streama. Postavka se pamti na ovom uređaju.</p><input id="streamInput" type="url" placeholder="https://..."><button id="save">Spremi</button><button id="cancel">Odustani</button></div></div><audio id="player" preload="none"></audio><script>
(function(){'use strict';var stations=[
['Extra FM',''],['Hit FM','https://streaming.hitfm.rs/hit.mp3'],['Absolut Relax','https://absolut-relax.live-sm.absolutradio.de/absolut-relax/stream/mp3'],['Absolut AI','https://absolut-ai.live-sm.absolutradio.de/absolut-ai/stream/mp3'],['Cool Radio',''],['Naxi Radio','https://naxi128ssl.streaming.rs:9152/'],['Antena Zagreb','https://audio.social3.hr/listen/antena_aac/stream'],['Otvoreni Radio','https://stream.otvoreni.hr/otvoreni'],['Radio Rijeka','https://playerservices.streamtheworld.com/api/livestream-redirect/RIJEKA.mp3'],['Naxi EX YU',''],['Die Neue 107.7',''],['NRJ Energy','https://frontend.streamonkey.net/energy-stuttgart/stream/mp3'],['Radio Ton','https://live.radioton.de/rt-live-hn'],['Big FM','https://stream.bigfm.de/bw/mp3-128/private'],['Hitradio Antenne 1','https://streams.antenne1.de/a1stg/mp3-128/streams.antenne1.de/']];
var audio=document.getElementById('player'),grid=document.getElementById('grid'),status=document.getElementById('status'),current=document.getElementById('current'),toggle=document.getElementById('toggle'),modal=document.getElementById('modal'),input=document.getElementById('streamInput'),selected=-1,editing=-1,hold=null,held=false,retries=0,retryTimer=null;
function url(i){try{return localStorage.getItem('jradio_v03_'+i)||stations[i][1]}catch(e){return stations[i][1]}}function say(t){status.textContent=t}function render(){grid.textContent='';for(var i=0;i<stations.length;i++){(function(n){var b=document.createElement('button');b.className='station'+(selected===n?' active':'')+(!url(n)?' missing':'');b.textContent=stations[n][0]+(!url(n)?' ⚙':'');b.onclick=function(){if(held){held=false;return}if(url(n))play(n);else edit(n)};b.oncontextmenu=function(e){e.preventDefault();edit(n)};b.addEventListener('touchstart',function(){held=false;hold=setTimeout(function(){held=true;edit(n)},850)},{passive:true});b.addEventListener('touchend',function(){clearTimeout(hold)},{passive:true});b.addEventListener('touchmove',function(){clearTimeout(hold)},{passive:true});grid.appendChild(b)})(i)}}function clearRetry(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}}function play(i){if(!url(i)){edit(i);return}clearRetry();retries=0;selected=i;audio.pause();audio.src=url(i);audio.load();current.textContent=stations[i][0];toggle.textContent='■ Zaustavi';say('Povezivanje: '+stations[i][0]+'…');render();attempt()}function attempt(){var p=audio.play();if(p&&p.catch)p.catch(function(e){say('Reprodukcija nije uspjela: '+(e.message||'nepoznata pogreška')+'. Dugi pritisak na postaju za izmjenu adrese.')})}function stop(){clearRetry();audio.pause();audio.removeAttribute('src');audio.load();selected=-1;current.textContent='Ništa ne svira';toggle.textContent='▶ Pokreni';say('Zaustavljeno.');render()}function edit(i){editing=i;document.getElementById('editTitle').textContent=stations[i][0];input.value=url(i);modal.style.display='block'}document.getElementById('save').onclick=function(){var u=input.value.trim();if(u&&!/^https:\/\//i.test(u)){alert('Potrebna je HTTPS adresa.');return}try{if(u)localStorage.setItem('jradio_v03_'+editing,u);else localStorage.removeItem('jradio_v03_'+editing)}catch(e){}modal.style.display='none';if(u)play(editing);else render()};document.getElementById('cancel').onclick=function(){modal.style.display='none'};toggle.onclick=function(){if(selected!==-1&&!audio.paused)stop();else if(selected!==-1)attempt();else{say('Odaberi postaju.')}};audio.onplaying=function(){retries=0;clearRetry();say('● UŽIVO — '+stations[selected][0]);toggle.textContent='■ Zaustavi'};audio.onwaiting=function(){say('Učitavanje streama…')};audio.onerror=function(){if(selected<0)return;var code=audio.error?audio.error.code:'?';say('Audio pogreška '+code+' — provjeri adresu postaje.');};audio.onstalled=function(){if(selected<0||retries>=2)return;retries++;say('Veza je zastala. Pokušaj ponovnog povezivanja '+retries+'/2…');clearRetry();retryTimer=setTimeout(function(){if(selected>=0){audio.load();attempt()}},3500)};audio.onended=function(){say('Stream je završio. Dodirni postaju za ponovno pokretanje.')};render()})();
</script></body></html>

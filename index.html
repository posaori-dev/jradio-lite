<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090c"><title>JRadio Lite</title><style>
*{box-sizing:border-box}html{background:#08090c}body{margin:0;background:linear-gradient(165deg,#17191f 0%,#0b0c10 42%,#08090c 100%);color:#f7f7fa;font-family:-apple-system,BlinkMacSystemFont,Arial,Helvetica,sans-serif;font-size:18px;min-height:100vh}header{padding:24px 23px 5px;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:31px;letter-spacing:-1.1px;font-weight:800}h1 span{color:#fb526e!important}.version{font-size:12px;color:#92939d}.status{margin:3px 24px 13px;color:#c0c1c9;min-height:20px;font-size:14px}.hint{display:none}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:5px 19px 125px}.station{position:relative;min-height:123px;padding:14px 8px 11px;border:1px solid #383941;border-radius:19px;background:#22232b;color:#f9f9fc;font:700 17px -apple-system,BlinkMacSystemFont,Arial,sans-serif;cursor:pointer;touch-action:manipulation;overflow:hidden}.station:focus-visible{outline:2px solid #fff;outline-offset:2px}.station.active{background:linear-gradient(140deg,#7b243d,#381d2c);border:2px solid #ff607e;box-shadow:0 0 0 1px rgba(255,96,126,.12)}.station .mark{display:block;margin:0 auto 12px;width:51px;height:51px;line-height:51px;border-radius:15px;background:linear-gradient(145deg,#494a59,#30313c);color:#fff;font-size:17px;font-weight:800;text-align:center}.station.active .mark{background:#fa5876;color:#fff}.station .sub{display:none}.station.active .sub{display:block;margin-top:7px;font-size:11px;color:#ffc1ce;font-weight:600}.station.missing{border-style:dashed}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1b1b22;border-top:1px solid #35343c;padding:14px 23px;min-height:85px;z-index:2}.bar small{display:block;font-size:11px;color:#a4a2ad;margin-bottom:6px;letter-spacing:.7px}.bar strong{font-size:20px;display:block;max-width:450px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar button,.panel button{border:0;border-radius:14px;background:#fb526e;color:white;padding:15px 19px;font:700 17px Arial;cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.9);padding:18px}.panel{max-width:640px;margin:8vh auto;background:#25252e;padding:24px;border-radius:20px}.panel p{font-size:15px;line-height:1.5;color:#d1d0d8}.panel input{display:block;width:100%;margin:16px 0;padding:15px;font-size:17px;border:0;border-radius:9px}.panel .secondary{background:#53535f;color:white;margin-left:8px}@media(max-width:680px){.grid{gap:8px;padding-left:11px;padding-right:11px}.station{font-size:14px;min-height:109px;padding:9px 4px}.station .mark{width:41px;height:41px;line-height:41px;margin-bottom:9px;font-size:14px}h1{font-size:26px}.bar strong{font-size:16px}.bar button{padding:12px 14px}}@media(min-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));max-width:900px;margin:auto}}
</style></head><body><header><h1>📻 JRadio <span style="color:#5de0c4">Lite</span></h1><span class="version">Family Hub · v1.4</span></header><p id="status" class="status" role="status">Odaberi postaju za slušanje.</p><div class="hint"></div><main id="grid" class="grid"></main><footer class="bar"><div><small id="nowLabel">TRENUTAČNO</small><strong id="current">Ništa ne svira</strong></div><button id="toggle" type="button">▶ Pokreni</button></footer><div id="modal" class="modal"><div class="panel"><h2 id="editTitle">Stream</h2><p>Upiši izravnu HTTPS adresu MP3/AAC streama. Spremit će se samo na ovom uređaju.</p><input id="streamInput" type="url" placeholder="https://..." aria-label="Adresa streama"><button id="save" type="button">Spremi</button><button id="cancel" class="secondary" type="button">Odustani</button></div></div><audio id="player" preload="none"></audio><script>
(function(){'use strict';
var stations=[
['Extra FM','https://audio.social3.hr/listen/extra_aac/stream'],['Hit FM','https://streaming.hitfm.rs/hit.mp3'],['Absolut Relax','https://absolut-relax.live-sm.absolutradio.de/absolut-relax/stream/mp3'],['Absolut AI','https://absolut-ai.live-sm.absolutradio.de/absolut-ai/stream/mp3'],['Cool Radio','https://live.coolradio.rs/cool128'],['Naxi Radio','https://naxi64.streaming.rs:9162/;stream.nsv'],['Antena Zagreb','https://audio.social3.hr/listen/antena_aac/stream'],['Otvoreni Radio','https://stream.otvoreni.hr/otvoreni'],['Radio Rijeka','https://playerservices.streamtheworld.com/api/livestream-redirect/RIJEKA.mp3'],['Naxi EX YU','https://naxidigital-exyu128ssl.streaming.rs:8242/;stream.nsv'],['Die Neue 107.7','https://addrad.io/4454xcp'],['NRJ Energy','https://frontend.streamonkey.net/energy-stuttgart/stream/mp3'],['Radio Ton','https://live.radioton.de/rt-live-hn'],['Big FM','https://stream.bigfm.de/bw/mp3-128/private'],['Hitradio Antenne 1','https://streams.antenne1.de/a1stg/mp3-128/streams.antenne1.de/']];
var audio=document.getElementById('player'),grid=document.getElementById('grid'),status=document.getElementById('status'),current=document.getElementById('current'),toggle=document.getElementById('toggle'),modal=document.getElementById('modal'),input=document.getElementById('streamInput');var selected=-1,editing=-1,hold=null,held=false,retries=0,retryTimer=null,requestId=0,manualStop=true;
function url(i){try{var v=localStorage.getItem('jradio_v03_'+i);return (v===null||v==='')?stations[i][1]:v}catch(e){return stations[i][1]}}
function say(s){status.textContent=s}function clearRetry(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}}
function initials(name){var parts=name.replace(/[^A-Za-z0-9À-ž ]/g,'').split(/ +/);return parts.length>1?(parts[0].charAt(0)+parts[1].charAt(0)).toUpperCase():name.slice(0,2).toUpperCase()}
function render(){grid.textContent='';for(var i=0;i<stations.length;i++){(function(n){var b=document.createElement('button');b.type='button';b.className='station'+(selected===n?' active':'')+(!url(n)?' missing':'');var mark=document.createElement('span');mark.className='mark';mark.textContent=initials(stations[n][0]);b.appendChild(mark);b.appendChild(document.createTextNode(stations[n][0]));var s=document.createElement('span');s.className='sub';s.textContent=selected===n?(audio.paused?'● ODABRANO':'● UŽIVO'):(!url(n)?'Dodaj stream':'');b.appendChild(s);b.onclick=function(){if(held){held=false;return}if(url(n))play(n);else edit(n)};b.oncontextmenu=function(e){e.preventDefault();edit(n)};b.addEventListener('touchstart',function(){held=false;clearTimeout(hold);hold=setTimeout(function(){held=true;edit(n)},850)}, {passive:true});b.addEventListener('touchend',function(){clearTimeout(hold)},{passive:true});b.addEventListener('touchmove',function(){clearTimeout(hold)},{passive:true});b.addEventListener('touchcancel',function(){clearTimeout(hold)},{passive:true});grid.appendChild(b)})(i)}}
function attempt(){var id=requestId;try{var p=audio.play();if(p&&p.catch)p.catch(function(e){if(id===requestId&&!manualStop)say('Neuspjela reprodukcija: '+(e.message||'stream nije dostupan'))})}catch(e){say('Pogreška reprodukcije: '+e.message)}}
function play(i){var u=url(i);if(!u){edit(i);return}clearRetry();requestId++;retries=0;manualStop=false;selected=i;audio.pause();audio.src=u;audio.load();current.textContent=stations[i][0];try{localStorage.setItem('jradio_last_station',String(i))}catch(e){}toggle.textContent='■ Zaustavi';say('Povezivanje: '+stations[i][0]+'…');render();attempt()}
function stop(){requestId++;manualStop=true;clearRetry();audio.pause();audio.removeAttribute('src');audio.load();current.textContent='Zaustavljeno';toggle.textContent='▶ Pokreni';say('Zaustavljeno.');render()}
function edit(i){editing=i;document.getElementById('editTitle').textContent=stations[i][0];input.value=url(i);modal.style.display='block'}
document.getElementById('save').onclick=function(){var u=input.value.trim();if(u&&!/^https:\/\//i.test(u)){alert('Upiši HTTPS stream adresu.');return}try{localStorage.setItem('jradio_v03_'+editing,u)}catch(e){say('Postavke se nisu mogle spremiti.')}modal.style.display='none';if(u)play(editing);else{if(selected===editing)stop();render()}};
document.getElementById('cancel').onclick=function(){modal.style.display='none'};
toggle.onclick=function(){if(selected<0){say('Prvo odaberi postaju.');return}if(!audio.paused)stop();else play(selected)};
audio.onplaying=function(){if(selected<0)return;retries=0;clearRetry();say('● UŽIVO — '+stations[selected][0]);toggle.textContent='■ Zaustavi';render()};
audio.onwaiting=function(){if(selected>=0)say('Učitavanje: '+stations[selected][0]+'…')};
audio.onerror=function(){if(selected<0||manualStop)return;var c=audio.error?audio.error.code:'?';say('Stream nije dostupan (audio pogreška '+c+'). Dugi pritisak za izmjenu adrese.')};
audio.onstalled=function(){if(selected<0||manualStop||retries>=2)return;retries++;say('Veza je zastala — ponovno povezivanje '+retries+'/2…');clearRetry();var id=requestId;retryTimer=setTimeout(function(){if(selected>=0&&!manualStop&&id===requestId){audio.load();attempt()}},4000)};
audio.onended=function(){if(selected>=0)say('Stream je završio. Dodirni postaju za ponovno pokretanje.')};try{var last=parseInt(localStorage.getItem('jradio_last_station'),10);if(last>=0&&last<stations.length){say('Zadnja slušana postaja: '+stations[last][0]+'. Dodirni za pokretanje.')}}catch(e){}render();
})();</script></body></html>

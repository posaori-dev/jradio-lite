<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1521"><title>JRadio Lite</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1521;color:#f5f9ff;font-family:Arial,Helvetica,sans-serif;font-size:18px}header{padding:22px 24px 12px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:32px;letter-spacing:-1px}.version{font-size:13px;color:#9bb0c5}.status{margin:0 24px 16px;color:#b8c9da;min-height:24px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:0 20px 150px}.station{position:relative;min-height:105px;padding:14px 10px;border:2px solid #30445d;border-radius:16px;background:#1c2c40;color:#fff;font:700 19px Arial,sans-serif;cursor:pointer;touch-action:manipulation}.station:focus-visible{outline:3px solid #fff}.station.active{background:#154b42;border-color:#5de0c4}.station.missing{border-style:dashed;color:#c7d1df}.station .sub{display:block;font-size:12px;font-weight:400;margin-top:8px;color:#a8bcd0}.station.active .sub{color:#91f5df}.bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#15263a;border-top:1px solid #3c5067;padding:17px 24px;min-height:105px}.bar small{display:block;font-size:12px;color:#9cb4c9;margin-bottom:7px}.bar strong{font-size:22px}.bar button,.panel button{border:0;border-radius:12px;background:#5de0c4;color:#0c2925;padding:15px 23px;font:700 18px Arial;cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.88);padding:18px}.panel{max-width:640px;margin:8vh auto;background:#21354a;padding:24px;border-radius:16px}.panel p{font-size:15px;line-height:1.5;color:#d5e0ec}.panel input{display:block;width:100%;margin:16px 0;padding:15px;font-size:17px;border:0;border-radius:9px}.panel .secondary{background:#71859b;color:white;margin-left:8px}.hint{padding:0 24px 12px;font-size:13px;color:#9cb4c9}@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-left:12px;padding-right:12px}.station{font-size:16px;min-height:88px}h1{font-size:26px}.bar strong{font-size:17px}.bar button{padding:13px 16px}}@media(min-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><h1>📻 JRadio <span style="color:#5de0c4">Lite</span></h1><span class="version">Family Hub · v1.0 beta</span></header><p id="status" class="status" role="status">Odaberi postaju za slušanje.</p><div class="hint">Za uređivanje streama: dugi pritisak na postaju (ili desni klik na Macu).</div><main id="grid" class="grid"></main><footer class="bar"><div><small>TRENUTAČNO</small><strong id="current">Ništa ne svira</strong></div><button id="toggle" type="button">▶ Pokreni</button></footer><div id="modal" class="modal"><div class="panel"><h2 id="editTitle">Stream</h2><p>Upiši izravnu HTTPS adresu MP3/AAC streama. Spremit će se samo na ovom uređaju.</p><input id="streamInput" type="url" placeholder="https://..." aria-label="Adresa streama"><button id="save" type="button">Spremi</button><button id="cancel" class="secondary" type="button">Odustani</button></div></div><audio id="player" preload="none"></audio><script>
(function(){'use strict';
var stations=[
['Extra FM',''],['Hit FM','https://streaming.hitfm.rs/hit.mp3'],['Absolut Relax','https://absolut-relax.live-sm.absolutradio.de/absolut-relax/stream/mp3'],['Absolut AI','https://absolut-ai.live-sm.absolutradio.de/absolut-ai/stream/mp3'],['Cool Radio',''],['Naxi Radio','https://naxi128ssl.streaming.rs:9152/'],['Antena Zagreb','https://audio.social3.hr/listen/antena_aac/stream'],['Otvoreni Radio','https://stream.otvoreni.hr/otvoreni'],['Radio Rijeka','https://playerservices.streamtheworld.com/api/livestream-redirect/RIJEKA.mp3'],['Naxi EX YU',''],['Die Neue 107.7',''],['NRJ Energy','https://frontend.streamonkey.net/energy-stuttgart/stream/mp3'],['Radio Ton','https://live.radioton.de/rt-live-hn'],['Big FM','https://stream.bigfm.de/bw/mp3-128/private'],['Hitradio Antenne 1','https://streams.antenne1.de/a1stg/mp3-128/streams.antenne1.de/']];
var audio=document.getElementById('player'),grid=document.getElementById('grid'),status=document.getElementById('status'),current=document.getElementById('current'),toggle=document.getElementById('toggle'),modal=document.getElementById('modal'),input=document.getElementById('streamInput');var selected=-1,editing=-1,hold=null,held=false,retries=0,retryTimer=null,requestId=0,manualStop=true;
function url(i){try{var v=localStorage.getItem('jradio_v03_'+i);return v===null?stations[i][1]:v}catch(e){return stations[i][1]}}
function say(s){status.textContent=s}function clearRetry(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}}
function render(){grid.textContent='';for(var i=0;i<stations.length;i++){(function(n){var b=document.createElement('button');b.type='button';b.className='station'+(selected===n?' active':'')+(!url(n)?' missing':'');b.appendChild(document.createTextNode(stations[n][0]));var s=document.createElement('span');s.className='sub';s.textContent=selected===n?'● ODABRANO':(!url(n)?'Dodaj stream':'Dodirni za slušanje');b.appendChild(s);b.onclick=function(){if(held){held=false;return}if(url(n))play(n);else edit(n)};b.oncontextmenu=function(e){e.preventDefault();edit(n)};b.addEventListener('touchstart',function(){held=false;clearTimeout(hold);hold=setTimeout(function(){held=true;edit(n)},850)}, {passive:true});b.addEventListener('touchend',function(){clearTimeout(hold)},{passive:true});b.addEventListener('touchmove',function(){clearTimeout(hold)},{passive:true});b.addEventListener('touchcancel',function(){clearTimeout(hold)},{passive:true});grid.appendChild(b)})(i)}}
function attempt(){var id=requestId;try{var p=audio.play();if(p&&p.catch)p.catch(function(e){if(id===requestId&&!manualStop)say('Neuspjela reprodukcija: '+(e.message||'stream nije dostupan'))})}catch(e){say('Pogreška reprodukcije: '+e.message)}}
function play(i){var u=url(i);if(!u){edit(i);return}clearRetry();requestId++;retries=0;manualStop=false;selected=i;audio.pause();audio.src=u;audio.load();current.textContent=stations[i][0];toggle.textContent='■ Zaustavi';say('Povezivanje: '+stations[i][0]+'…');render();attempt()}
function stop(){requestId++;manualStop=true;clearRetry();audio.pause();audio.removeAttribute('src');audio.load();selected=-1;current.textContent='Ništa ne svira';toggle.textContent='▶ Pokreni';say('Zaustavljeno.');render()}
function edit(i){editing=i;document.getElementById('editTitle').textContent=stations[i][0];input.value=url(i);modal.style.display='block'}
document.getElementById('save').onclick=function(){var u=input.value.trim();if(u&&!/^https:\/\//i.test(u)){alert('Upiši HTTPS stream adresu.');return}try{localStorage.setItem('jradio_v03_'+editing,u)}catch(e){say('Postavke se nisu mogle spremiti.')}modal.style.display='none';if(u)play(editing);else{if(selected===editing)stop();render()}};
document.getElementById('cancel').onclick=function(){modal.style.display='none'};
toggle.onclick=function(){if(selected<0){say('Prvo odaberi postaju.');return}if(!audio.paused)stop();else attempt()};
audio.onplaying=function(){if(selected<0)return;retries=0;clearRetry();say('● UŽIVO — '+stations[selected][0]);toggle.textContent='■ Zaustavi'};
audio.onwaiting=function(){if(selected>=0)say('Učitavanje: '+stations[selected][0]+'…')};
audio.onerror=function(){if(selected<0||manualStop)return;var c=audio.error?audio.error.code:'?';say('Stream nije dostupan (audio pogreška '+c+'). Dugi pritisak za izmjenu adrese.')};
audio.onstalled=function(){if(selected<0||manualStop||retries>=2)return;retries++;say('Veza je zastala — ponovno povezivanje '+retries+'/2…');clearRetry();var id=requestId;retryTimer=setTimeout(function(){if(selected>=0&&!manualStop&&id===requestId){audio.load();attempt()}},4000)};
audio.onended=function(){if(selected>=0)say('Stream je završio. Dodirni postaju za ponovno pokretanje.')};render();
})();</script></body></html>
